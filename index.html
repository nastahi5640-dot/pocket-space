<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pocket Space</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg: #f6f5f2;
      --card: #ffffff;
      --text: #1f1f24;
      --subtext: #82828c;
      --accent: #7c5dfa;
      --accent-soft: #ede9fe;
      --green: #10b981;
      --red: #ef4444;
      --border: #eceae4;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    body.dark {
      --bg: #121216;
      --card: #1c1c22;
      --text: #f3f3f6;
      --subtext: #9494a0;
      --accent: #8b72ff;
      --accent-soft: rgba(139, 114, 255, 0.16);
      --border: #2a2a32;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px 16px 90px;
      transition: background 0.3s, color 0.3s;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .theme-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .section { display: none; animation: fadeIn 0.25s ease; }
    .section.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Копилка */
    .goal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .goal-title { font-size: 14px; color: var(--subtext); font-weight: 500; }
    .edit-goal-btn {
      background: none; border: none; color: var(--accent);
      font-size: 13px; font-weight: 600; cursor: pointer;
    }

    .balance-big {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: -1px;
    }

    .goal-sub { font-size: 13px; color: var(--subtext); margin-bottom: 14px; }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: var(--accent-soft);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      width: 0%;
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .quick-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .chip-btn {
      background: var(--accent-soft);
      color: var(--accent);
      border: none;
      padding: 10px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .chip-btn:active { transform: scale(0.96); }

    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.12);
      color: var(--red);
      border: none;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .history-item:last-child { border-bottom: none; }
    .amount-plus { color: var(--green); font-weight: 700; }
    .amount-minus { color: var(--red); font-weight: 700; }

    /* Задачи */
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: var(--bg);
      border-radius: 14px;
      margin-bottom: 8px;
      gap: 10px;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      cursor: pointer;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
      font-size: 13px;
    }

    .task-item.done .checkbox { background: var(--accent); }
    .task-item.done .task-text { text-decoration: line-through; color: var(--subtext); }

    .tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .del-btn {
      background: none;
      border: none;
      color: var(--subtext);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    /* Заметки */
    .note-card {
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 10px;
      position: relative;
      color: #1f1f24;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .note-date {
      font-size: 11px;
      opacity: 0.6;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
    }

    /* Нижняя навигация */
    .nav {
      position: fixed;
      bottom: 14px;
      left: 16px;
      right: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      z-index: 100;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--subtext);
      padding: 10px 6px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      transition: 0.2s;
    }

    .nav-btn span.icon { font-size: 18px; }
    .nav-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>✨ Pocket Space</h1>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>

  <!-- ВКЛАДКА 1: КОПИЛКА -->
  <div id="tab-money" class="section active">
    <div class="card">
      <div class="goal-header">
        <span class="goal-title" id="goalNameDisplay">🎯 Цель: Новая мечта</span>
        <button class="edit-goal-btn" onclick="editGoal()">Изменить</button>
      </div>
      <div class="balance-big" id="balanceDisplay">0 ₽</div>
      <div class="goal-sub" id="goalProgressText">Накоплено 0% из 30 000 ₽</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="quick-btns">
        <button class="chip-btn" onclick="addMoney(500, 'Быстрое пополнение')">+500 ₽</button>
        <button class="chip-btn" onclick="addMoney(1000, 'Быстрое пополнение')">+1 000 ₽</button>
        <button class="chip-btn" onclick="addMoney(3000, 'Зарплата / доход')">+3 000 ₽</button>
      </div>

      <div class="input-row">
        <input type="number" id="customAmount" placeholder="Сумма (₽)" />
        <input type="text" id="customNote" placeholder="За что?" />
      </div>
      <div class="input-row">
        <button class="btn-primary" style="flex:1" onclick="handleCustomMoney(true)">+ Доход</button>
        <button class="btn-danger" onclick="handleCustomMoney(false)">− Трата</button>
      </div>
    </div>

    <div class="card">
      <div class="goal-header">
        <span class="goal-title">История операций</span>
        <button class="edit-goal-btn" onclick="clearHistory()">Очистить</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- ВКЛАДКА 2: ДЕЛА И ДОМАШКА -->
  <div id="tab-tasks" class="section">
    <div class="card">
      <div class="input-row" style="margin-top:0; margin-bottom: 10px;">
        <input type="text" id="taskInput" placeholder="Что нужно сделать или сдать?" />
      </div>
      <div class="input-row">
        <select id="taskTag">
          <option value="Вуз">📚 Вуз / Домашка</option>
          <option value="Личное">✨ Личное</option>
          <option value="Работа">💼 Работа</option>
        </select>
        <button class="btn-primary" onclick="addTask()">Добавить</button>
      </div>
    </div>

    <div class="card">
      <div class="goal-header">
        <span class="goal-title">Мои задачи</span>
      </div>
      <div id="taskList"></div>
    </div>
  </div>

  <!-- ВКЛАДКА 3: ЗАМЕТКИ -->
  <div id="tab-notes" class="section">
    <div class="card">
      <textarea id="noteInput" rows="3" placeholder="Запиши мысль, идею, фильм на вечер..."></textarea>
